name: CI/CD Pipeline

on: 
  push:
    branches:
      -dev
      -feat-creacion-pipeline
  pull_request:
    branches:
      - main
jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432: 5432

    steps:
      -name: Checkout code
       uses: actions/checkout@v4

      -name: Install dependencies
       run: npm ci 
      -name: Create test .env file
       run:  |
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" >> .env
          echo "EMAIL_HOST=smtp.gmail.com" >> .env
          echo "EMAIL_PORT=587" >> .env
          echo "EMAIL_USER=test@example.com" >> .env
          echo "EMAIL_PASS=test_password" >> .env

      -name: Run tests 
       run: npm test || echo "No test configured"
       env:
       DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      
      -name: Test server startup
       run: |
        timeout 10s node server.js || exit 0
       env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
    
    deploy:
      runs-on: ubuntu-latest
      needs: test-and-build
      if: github.even_name == 'pull_request' && github.base_ref == 'main'

      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Deloyment check
          run: echo "Listo para el merge"

